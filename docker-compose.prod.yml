# Production-оверрайд для деплоя.
#
# Запуск:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Миграции + сид (однократно после первого запуска / после git pull):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile tools run --rm migrate
#
# Отличия от базового docker-compose.yml:
#  - site/crm слушают ТОЛЬКО на 127.0.0.1 – наружу их публикует nginx;
#  - добавлен одноразовый сервис migrate (prisma migrate deploy + seed).

services:
  site:
    ports:
      - "127.0.0.1:4321:4321"

  crm:
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Какой коммит собран в этот образ. Проставляет deploy.sh, отдаёт
      # /api/admin/health. Без этого «что реально задеплоено» приходится
      # выяснять по косвенным признакам – однажды это стоило полдня.
      GIT_COMMIT: ${GIT_COMMIT:-}

  # nginx раньше сидел в профиле `disabled` – предполагалось, что наружу
  # смотрит Plesk. Плеска нет, сайт обслуживает этот самый контейнер, и
  # выключённым профилем он выпадал из-под управления deploy.sh: конфиг
  # менялся в репозитории, а контейнер жил со старым, пока его не пнут руками.
  nginx: {}

  migrate:
    build:
      context: .
      dockerfile: packages/db/Dockerfile.migrate
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - tools
