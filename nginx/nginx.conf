# DOZA – nginx reverse proxy (HTTPS)
# doza-parfum.by / www  → site (Astro :4321)
# crm.doza-parfum.by    → crm  (Next.js :3000)
# Один сертификат Let's Encrypt покрывает все три имени.

# Резолвер Docker. Без него nginx разрешает имена контейнеров один раз при
# старте и держит IP до перезапуска. Деплой пересоздаёт site и crm, адреса
# меняются – и nginx продолжает стучаться по старым: то 502, то, если старый
# контейнер ещё жив, молча отдаёт прошлую версию сайта. Второе хуже: всё
# выглядит рабочим, а изменений нет.
#
# 127.0.0.11 – встроенный DNS Docker, он есть в любой пользовательской сети.
resolver 127.0.0.11 valid=10s ipv6=off;

# Общие proxy-заголовки
proxy_http_version 1.1;

# Лимит размера загружаемого файла (фото товаров до 8 МБ в приложении)
client_max_body_size 10m;

# ── HTTP → редирект на HTTPS (+ ACME challenge для продления) ───────────────────
server {
    listen 80;
    server_name doza-parfum.by www.doza-parfum.by crm.doza-parfum.by;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: публичный сайт ───────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name doza-parfum.by www.doza-parfum.by;

    ssl_certificate     /etc/letsencrypt/live/doza-parfum.by/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doza-parfum.by/privkey.pem;

    # загруженные фото – напрямую из общего volume
    location /uploads/ {
        alias /var/www/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        # Имя в переменной – иначе nginx резолвит его на старте и кеширует.
        set $upstream_site site:4321;
        proxy_pass http://$upstream_site$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── HTTPS: CRM ──────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name crm.doza-parfum.by;

    ssl_certificate     /etc/letsencrypt/live/doza-parfum.by/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doza-parfum.by/privkey.pem;

    location /uploads/ {
        alias /var/www/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        set $upstream_crm crm:3000;
        proxy_pass http://$upstream_crm$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
