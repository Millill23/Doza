# DOZA — nginx reverse proxy (HTTPS)
# doza-parfum.by / www  → site (Astro :4321)
# crm.doza-parfum.by    → crm  (Next.js :3000)
# Один сертификат Let's Encrypt покрывает все три имени.

upstream doza_site { server site:4321; }
upstream doza_crm  { server crm:3000; }

# Общие proxy-заголовки
proxy_http_version 1.1;

# Лимит размера загружаемого файла (фото товаров до 8 МБ в приложении)
client_max_body_size 10m;

# ── HTTP → редирект на HTTPS (+ ACME challenge для продления) ───────────────────
server {
    listen 80;
    server_name doza-parfum.by www.doza-parfum.by crm.doza-parfum.by;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: публичный сайт ───────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name doza-parfum.by www.doza-parfum.by;

    ssl_certificate     /etc/letsencrypt/live/doza-parfum.by/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doza-parfum.by/privkey.pem;

    # загруженные фото — напрямую из общего volume
    location /uploads/ {
        alias /var/www/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://doza_site;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── HTTPS: CRM ──────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name crm.doza-parfum.by;

    ssl_certificate     /etc/letsencrypt/live/doza-parfum.by/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doza-parfum.by/privkey.pem;

    location /uploads/ {
        alias /var/www/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://doza_crm;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
