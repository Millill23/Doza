# DOZA — nginx reverse proxy
# doza-parfum.by      → site (Astro :4321)
# crm.doza-parfum.by  → crm  (Next.js :3000)
#
# Для боевого HTTPS раскомментируйте блоки 443 и пути к сертификатам Let's Encrypt.

upstream doza_site { server site:4321; }
upstream doza_crm  { server crm:3000; }

# ── Публичный сайт ────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name doza-parfum.by www.doza-parfum.by;

    # ACME challenge для certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Загруженные фото — напрямую из общего volume
    location /uploads/ {
        alias /var/www/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://doza_site;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── CRM ────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name crm.doza-parfum.by;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /uploads/ {
        alias /var/www/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://doza_crm;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

