services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-doza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doza_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-doza}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doza}"]
      interval: 10s
      timeout: 5s
      retries: 5

  site:
    build:
      context: .
      dockerfile: apps/site/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      UPLOADS_DIR: /uploads
      # Магазин работает в Беларуси, а контейнер по умолчанию живёт в UTC.
      # Без этого «сегодня» в отчётах и датах наступает на три часа позже:
      # вечерние продажи уезжают в следующий день.
      TZ: Europe/Minsk
    volumes:
      - uploads:/uploads:ro
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "4321"

  crm:
    build:
      context: .
      dockerfile: apps/crm/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      UPLOADS_DIR: /uploads
      TZ: Europe/Minsk
    volumes:
      - uploads:/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  # Планировщик. Шаг в 5 минут задан сверкой платежей: покупатель может
  # закрыть вкладку сразу после оплаты, не нажав «Продолжить», и если вебхук
  # не дойдёт, заказ обязан всё равно попасть к продавцу без долгого ожидания.
  # Все три задачи идемпотентны, поэтому частые вызовы безвредны: подарки
  # выдаются раз за повод, напоминание — раз за акцию, а уже оплаченный заказ
  # повторная сверка не трогает.
  cron:
    image: alpine:3
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Minsk
    depends_on:
      - crm
      - site
    # Ответы задач пишутся в лог контейнера, а не в /dev/null. Раньше вывод
    # глушился целиком, и сломанный планировщик выглядел точно так же, как
    # работающий: незаполненный CRON_SECRET месяц отбивал каждый вызов, а в
    # логах было пусто. Смотреть: docker compose logs --tail=50 cron
    command:
      - sh
      - -c
      - |
        if [ -z "$${CRON_SECRET}" ]; then
          echo "[cron] CRON_SECRET не задан — задачи выполняться не будут"
        fi
        while true; do
          sleep 300
          for task in "crm:3000/api/cron/promo-reminders" "crm:3000/api/cron/daily-rewards" "site:4321/api/cron/reconcile-payments"; do
            answer=$$(wget -q -O- "http://$${task}?key=$${CRON_SECRET}" 2>&1)
            code=$$?
            if [ $$code -eq 0 ]; then
              echo "[cron] $${task} -> $${answer}"
            else
              echo "[cron] $${task} -> НЕ ОТВЕТИЛ (wget $${code}); проверьте CRON_SECRET и логи crm"
            fi
          done
        done

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - uploads:/var/www/uploads:ro
    depends_on:
      - site
      - crm

volumes:
  pgdata:
  uploads:
