services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-doza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doza_dev_pass}
      POSTGRES_DB: ${POSTGRES_DB:-doza}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doza}"]
      interval: 10s
      timeout: 5s
      retries: 5

  site:
    build:
      context: .
      dockerfile: apps/site/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      UPLOADS_DIR: /uploads
    volumes:
      - uploads:/uploads:ro
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "4321"

  crm:
    build:
      context: .
      dockerfile: apps/crm/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      UPLOADS_DIR: /uploads
    volumes:
      - uploads:/uploads
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - uploads:/var/www/uploads:ro
    depends_on:
      - site
      - crm

volumes:
  pgdata:
  uploads:
